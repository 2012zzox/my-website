
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurboWarp 自动消息发送演示</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 800px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 20px;
        }
        .iframe-wrapper {
            position: relative;
            width: 100%;
            height: 400px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            background-color: #fafafa;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .status.pending {
            background-color: #fff3cd;
            color: #856404;
        }
        .status.success {
            background-color: #d4edda;
            color: #155724;
        }
        .config-area {
            margin-bottom: 20px;
            text-align: left;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #444;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>TurboWarp 自动消息发送器</h1>
    <p>页面加载完成后，将自动向嵌入的 TurboWarp 项目发送消息 <strong>"0.1.0"</strong>。</p>
    
    <div class="config-area">
        <label for="projectUrl">TurboWarp 项目 Embed URL:</label>
        <input type="text" id="projectUrl" value="https://turbowarp.org/414716080/embed" placeholder="请输入 embed 链接">
        <button onclick="reloadIframe()">重新加载并发送</button>
    </div>

    <div class="iframe-wrapper">
        <iframe id="twFrame" src="" allowtransparency="true" frameborder="0" scrolling="no"></iframe>
    </div>

    <div id="statusMsg" class="status pending">等待 iframe 加载...</div>
</div>

<script>
    const iframe = document.getElementById('twFrame');
    const statusMsg = document.getElementById('statusMsg');
    const urlInput = document.getElementById('projectUrl');
    const MESSAGE_TO_SEND = "0.1.0";

    // 初始化加载
    window.onload = function() {
        loadProject();
    };

    function loadProject() {
        const url = urlInput.value.trim();
        if (!url) {
            alert("请输入有效的 TurboWarp Embed URL");
            return;
        }
        
        statusMsg.textContent = "正在加载项目...";
        statusMsg.className = "status pending";
        
        // 设置 src 触发加载
        iframe.src = url;
    }

    function reloadIframe() {
        loadProject();
    }

    // 监听 iframe 加载完成事件
    iframe.onload = function() {
        console.log("Iframe loaded, attempting to send message...");
        statusMsg.textContent = "Iframe 已加载，正在发送消息...";
        
        // 稍微延迟以确保 TurboWarp 运行时完全初始化
        setTimeout(() => {
            sendMessageToIframe();
        }, 1000);
    };

    function sendMessageToIframe() {
        try {
            // 获取 iframe 的 window 对象
            const iframeWindow = iframe.contentWindow;
            
            if (iframeWindow) {
                // 发送消息，目标源设为 '*' 以兼容各种部署环境
                // 在生产环境中，建议将 '*' 替换为具体的域名以提高安全性
                iframeWindow.postMessage(MESSAGE_TO_SEND, '*');
                
                statusMsg.textContent = `成功发送消息: "${MESSAGE_TO_SEND}"`;
                statusMsg.className = "status success";
                console.log(`Message sent: ${MESSAGE_TO_SEND}`);
            } else {
                throw new Error("无法访问 iframe 内容窗口");
            }
        } catch (error) {
            console.error("发送消息失败:", error);
            statusMsg.textContent = "发送失败: " + error.message;
            statusMsg.className = "status pending";
        }
    }
</script>

</body>
</html>
