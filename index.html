<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>TurboWarp Auto Send</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* 隐藏滚动条 */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- 
      请将 src 替换为你自己的 TurboWarp 项目 embed 地址 
      例如: https://turbowarp.org/414716080/embed
    -->
    <iframe id="twFrame" src="https://turbowarp.org/414716080/embed"></iframe>

    <script>
        const iframe = document.getElementById('twFrame');
        const messageToSend = "0.1.0"; // 你要发送的消息内容

        // 核心逻辑：监听 iframe 加载完成事件
        iframe.onload = function() {
            console.log("Iframe loaded, sending message...");
            
            // 延迟一小段时间确保 TurboWarp 运行时已完全初始化
            // 虽然 onload 通常足够，但加一点缓冲更稳健
            setTimeout(() => {
                if (iframe.contentWindow) {
                    // 向 iframe 内部发送消息
                    // '*' 表示允许发送给任何源，生产环境建议替换为 'https://turbowarp.org'
                    iframe.contentWindow.postMessage(messageToSend, '*');
                    console.log("Message sent:", messageToSend);
                }
            }, 500); 
        };
    </script>

</body>
</html>
